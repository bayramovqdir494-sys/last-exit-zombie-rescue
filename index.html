<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Last Exit: Zombie Rescue</title>
<style>:root{color-scheme:dark;--acc:#b6ff3b;--acc2:#ff7a1a;--red:#e0332b;--gold:#ffcc33;--panel:rgba(12,14,16,.82);--line:rgba(255,255,255,.12);--txt:#eef0ea;--dim:#9aa196;--f:'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;--h:Impact,'Arial Black','Franklin Gothic Heavy',sans-serif;--s:clamp(11px,1.15vw,15px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-synthesis:none;width:100%;height:100%;overflow:hidden;background:#0b0d0e;color:var(--txt);font-family:var(--f);font-size:var(--s);user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
body.ingame,body.ingame canvas{cursor:none}
canvas#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
#ui button{pointer-events:auto;font-family:inherit}
.hidden{display:none!important}
.ico-scrap{display:inline-block;width:1em;height:1em;vertical-align:-.12em;margin-right:.25em;border-radius:50%;background:radial-gradient(circle at 50% 50%,#3a2e14 0 28%,transparent 30%),conic-gradient(from 30deg,#e8c25a,#a07a26,#e8c25a,#a07a26,#e8c25a,#a07a26,#e8c25a);box-shadow:0 0 0 1px rgba(0,0,0,.4)}
kbd{display:inline-block;min-width:1.7em;padding:.05em .4em;border:1px solid rgba(255,255,255,.5);border-bottom-width:3px;border-radius:4px;font:700 .9em var(--f);text-align:center;margin:0 .2em;background:rgba(0,0,0,.35)}
/* ---------- HUD */
#hud{position:absolute;inset:0}
.hud-tl{position:absolute;left:14px;top:12px;width:min(300px,34vw)}
.hpbar,.carbar{position:relative;height:22px;background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.18);border-radius:4px;overflow:hidden;margin-bottom:6px;transform:skewX(-12deg)}
.hp-fill,.hp-ghost,.car-fill{position:absolute;left:0;top:0;bottom:0}
.hp-ghost{background:#fff;opacity:.35;transition:none}
.hp-fill{background:linear-gradient(#ff6a55,#c8261c);z-index:1}
.car-fill{background:linear-gradient(#ffc04a,#c87a12)}
.hp-txt,.car-txt{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;font:700 12px var(--f);text-shadow:0 1px 2px #000;transform:skewX(12deg)}
.hp-ico{position:absolute;left:7px;top:2px;z-index:3;font-size:13px;transform:skewX(12deg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:rgba(0,0,0,.5);border:1px solid var(--line);border-radius:4px;padding:3px 8px;font-size:13px;display:flex;align-items:center;gap:3px}
.chip b{font-family:var(--h);font-weight:400;font-size:15px;letter-spacing:.5px}
.hud-tc{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;width:min(560px,60vw)}
.obj{background:linear-gradient(90deg,transparent,rgba(0,0,0,.72) 18%,rgba(0,0,0,.72) 82%,transparent);padding:5px 50px 6px;text-align:center;border-top:2px solid var(--acc);position:relative}
.obj.warn{border-color:var(--acc2);animation:blink .5s infinite alternate}
.obj-t{font:700 clamp(16px,1.8vw,24px) var(--h);letter-spacing:1.5px;text-shadow:0 2px 3px #000}
.obj-s{color:var(--dim);font-size:12px}
.obj-timer{font:700 28px var(--h);color:var(--acc);text-shadow:0 0 12px rgba(182,255,59,.5)}
.obj.warn .obj-timer{color:var(--acc2)}
.hint{margin-top:6px;background:rgba(182,255,59,.92);color:#11160a;font-weight:700;padding:5px 14px;border-radius:4px;font-size:clamp(12px,1.25vw,15px);text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.4);animation:pop .3s}
.toasts{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:6px}
.toast{background:rgba(0,0,0,.72);border-left:3px solid #6ad0ff;padding:4px 14px;font-weight:700;font-size:13px;letter-spacing:.3px;animation:toastin .25s ease-out;transition:opacity .4s,transform .4s}
.toast.ok{border-color:var(--acc)}.toast.bad{border-color:var(--red);color:#ffb0a8}.toast.gold{border-color:var(--gold);color:var(--gold)}
.toast.out{opacity:0;transform:translateY(-8px)}
.hud-tr{position:absolute;right:12px;top:12px;display:flex;gap:8px;align-items:flex-start}
.minimap{width:min(150px,17vw);height:min(150px,17vw);border-radius:50%;border:2px solid rgba(255,255,255,.35);box-shadow:0 0 0 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.4)}
.pausebtn{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:rgba(0,0,0,.5);color:#fff;font-size:12px;letter-spacing:-2px}
.hud-bl{position:absolute;left:14px;bottom:14px}
.weap{background:linear-gradient(90deg,rgba(0,0,0,.7),rgba(0,0,0,0));padding:8px 40px 8px 10px;border-left:3px solid var(--acc)}
.w-slots{display:flex;gap:4px;margin-bottom:3px}
.w-slots span{font:700 10px var(--f);color:var(--dim);border:1px solid var(--line);padding:1px 5px;border-radius:3px}
.w-slots span em{font-style:normal;margin-left:4px}
.w-slots span.on{color:#111;background:var(--acc);border-color:var(--acc)}
.w-name{font:700 16px var(--h);letter-spacing:1px}
.w-ammo b{font:700 30px var(--h)}.w-ammo small{color:var(--dim);font-size:14px}
.w-ammo.low b{color:var(--red)}
.w-reload{height:4px;width:130px;background:rgba(255,255,255,.15);margin-top:3px;transition:opacity .2s}.w-reload div{height:100%;background:var(--acc)}
.hud-bc{position:absolute;left:50%;bottom:18px;transform:translateX(-50%)}
.prompt{background:rgba(0,0,0,.7);padding:6px 14px;border-radius:20px;font-weight:600;white-space:nowrap}
.combo{position:absolute;right:16px;top:calc(min(150px,17vw) + 26px);text-align:right;text-shadow:0 2px 4px #000}
.combo b{display:block;font:700 34px var(--h);color:var(--gold);line-height:1}.combo span{font:700 11px var(--f);letter-spacing:2px;color:#fff}
.combo.pop b{animation:cpop .18s}
.grade{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 55%,transparent 58%,rgba(0,0,0,.32));pointer-events:none}
.vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 45%,rgba(200,0,0,.65));opacity:0;pointer-events:none}
.lowhp{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(120,0,0,.8));opacity:0;pointer-events:none}
#hud::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.35))}
.markers{position:absolute;inset:0;overflow:hidden}
.mk{position:absolute;left:0;top:0;width:0;height:0}
.mk-lbl{position:absolute;transform:translate(-50%,-110%);white-space:nowrap;background:rgba(0,0,0,.7);padding:2px 8px;border-radius:3px;font-size:11px;font-weight:700}
.mk-lbl b{margin-right:4px}
.mk-arrow{position:absolute;left:-9px;top:-9px;width:18px;height:18px;text-align:center;font-size:16px;line-height:18px;display:none}
.mk.off .mk-arrow{display:block}
.mk.off .mk-lbl{transform:translate(-50%,-150%)}
.mk-surv .mk-lbl b,.mk-surv .mk-arrow{color:#ff6a50}.mk-surv .mk-lbl{border:1px solid rgba(255,90,70,.6);animation:blink .6s infinite alternate}
.mk-ex .mk-lbl b,.mk-ex .mk-arrow{color:#5aff7a}.mk-ex .mk-lbl{border:1px solid rgba(90,255,122,.6)}
.mk-car .mk-lbl b,.mk-car .mk-arrow{color:#4ad0ff}.mk-car .mk-lbl{border:1px solid rgba(74,208,255,.7);animation:blink .5s infinite alternate}
.mk-boss .mk-lbl{border:1px solid var(--red);min-width:120px;text-align:center}.mk-boss .mk-lbl b{color:var(--red)}
.bossbar{height:5px;background:#300;margin-top:2px}.bossbar div{height:100%;background:var(--red)}
.xhair{position:fixed;left:0;top:0;width:0;height:0;z-index:5;--sp:12px;pointer-events:none}
.xhair span{position:absolute;background:#fff;box-shadow:0 0 2px #000}
.xhair span:nth-child(1){width:2px;height:8px;left:-1px;top:calc(-8px - var(--sp))}
.xhair span:nth-child(2){width:2px;height:8px;left:-1px;top:var(--sp)}
.xhair span:nth-child(3){height:2px;width:8px;top:-1px;left:calc(-8px - var(--sp))}
.xhair span:nth-child(4){height:2px;width:8px;top:-1px;left:var(--sp)}
.xhair i{position:absolute;left:-2px;top:-2px;width:4px;height:4px;border-radius:50%;background:var(--acc)}
.xhair.hit span{background:#ffd040;animation:xh .15s}.xhair.kill span{background:var(--red);animation:xh .25s}
/* touch */
.touch{position:absolute;inset:0}
.stick{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.18);display:none}
.stick.on{display:block}
.stick .knob{position:absolute;left:30px;top:30px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.35)}
.stick.R{border-color:rgba(255,120,90,.5)}
.tbtns{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:14px;width:290px;height:184px;pointer-events:none}
.tb{position:absolute;width:54px;height:54px;border-radius:50%;border:2px solid rgba(255,255,255,.38);background:rgba(0,0,0,.45);color:#fff;font-size:21px;touch-action:none;pointer-events:auto;padding:0;-webkit-user-select:none;user-select:none}
.tb em{position:absolute;right:-3px;bottom:-3px;font:700 11px var(--f);background:var(--acc);color:#111;border-radius:8px;padding:0 5px;font-style:normal}
.tb.on{background:rgba(182,255,59,.45)}
.tb-fire{right:0;bottom:0;width:90px;height:90px;border:3px solid rgba(255,130,95,.85);background:radial-gradient(circle,rgba(255,90,60,.45),rgba(120,20,10,.45))}
.tb-fire i{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid #fff;border-radius:50%;opacity:.9}
.tb-fire i:before,.tb-fire i:after{content:"";position:absolute;background:#fff;left:50%;top:-9px;width:3px;height:46px;margin-left:-1.5px}
.tb-fire i:after{transform:rotate(90deg)}
.tb-fire.on{background:radial-gradient(circle,rgba(255,150,90,.7),rgba(170,40,20,.6))}
.tb-dodge{right:128px;bottom:8px}.tb-gren{right:116px;bottom:67px}.tb-rel{right:76px;bottom:112px}.tb-swap{right:18px;bottom:128px}
.tb-car{right:192px;bottom:10px;width:96px;height:44px;border-radius:24px}
.tb-car.ready{border-color:#4ad0ff;background:rgba(74,208,255,.3);animation:blink .6s infinite alternate}
.tb-car.dim{opacity:.35}
.stick-ghost{position:absolute;left:max(40px,env(safe-area-inset-left));bottom:34px;width:104px;height:104px;border-radius:50%;border:2px dashed rgba(255,255,255,.22);pointer-events:none}
.stick-ghost i{position:absolute;left:32px;top:32px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.14)}
.stick-ghost.hidden{display:none}
/* ---------- screens */
#screen{position:absolute;inset:0;pointer-events:none}
#screen>*{pointer-events:auto}
#screen.dim{background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
#screen.red{background:radial-gradient(ellipse at center,rgba(60,0,0,.6),rgba(0,0,0,.85))}
#screen.hubbg{background:linear-gradient(90deg,rgba(6,8,9,.92) 0,rgba(6,8,9,.78) 55%,rgba(6,8,9,.25) 100%)}
.btn{pointer-events:auto;cursor:pointer;border:0;border-radius:5px;padding:9px 16px;font:700 13px var(--f);letter-spacing:.8px;color:#fff;background:#2c3236;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);transition:transform .08s,filter .15s;display:inline-flex;align-items:center;gap:4px;justify-content:center}
.btn:hover{filter:brightness(1.2)}.btn:active{transform:translateY(1px) scale(.98)}
.btn.go{background:linear-gradient(#c6ff55,#8fd12a);color:#141a08}
.btn.ad{background:linear-gradient(#ffb347,#ff7a1a);color:#1a0d00}
.btn.big{font:700 20px var(--h);letter-spacing:1.5px;padding:10px 26px}
.btn.cant{opacity:.45}
.btn.buy{background:#3a3020;color:var(--gold)}
.btn.tog{background:#3a4046}.btn.tog.on{background:#465a2a}
.iconbtn{width:36px;height:36px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-size:18px;cursor:pointer}
.logo{font:700 64px var(--h);letter-spacing:3px;line-height:.9;color:#fff;text-shadow:0 3px 0 #6a120c,0 6px 18px rgba(0,0,0,.6)}
.logo small{display:block;font:700 13px var(--f);letter-spacing:7px;color:var(--acc);text-shadow:none;margin-top:4px}
.logo.sm{font-size:30px;letter-spacing:2px}.logo.sm small{font-size:9px;letter-spacing:4px;margin-top:2px}
/* hub */
.hub{position:absolute;inset:0;display:flex;flex-direction:column;padding:14px 18px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.tb-right{display:flex;gap:12px;align-items:center}
.lvl{display:flex;flex-direction:column;align-items:flex-end;gap:2px}.lvl b{font:700 16px var(--h);letter-spacing:1px}.lvl small{color:var(--dim);font-size:10px}
.xpbar{width:150px;height:6px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}.xpbar div{height:100%;background:var(--acc)}
.money{background:rgba(0,0,0,.5);border:1px solid rgba(255,204,51,.35);padding:6px 12px;border-radius:6px;font:700 20px var(--h);letter-spacing:1px;color:var(--gold)}
.hub-main{flex:1;display:flex;gap:14px;min-height:0}
.hub nav{display:flex;flex-direction:column;gap:6px;width:120px}
.nav{position:relative;cursor:pointer;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#cfd4cc;border-radius:6px;padding:10px 8px;font:700 15px var(--h);letter-spacing:1.5px;text-align:left;display:flex;align-items:center;gap:8px}
.nav span{font-size:16px;width:22px;text-align:center}
.nav.on{background:var(--acc);color:#141a08;border-color:var(--acc)}
.nav .dot{position:absolute;right:8px;top:8px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px rgba(0,0,0,.5);animation:blink .7s infinite alternate}
.panel{flex:1;max-width:820px;overflow-y:auto;padding:4px 10px 14px 4px;scrollbar-width:thin}
.panel h2{font:700 26px var(--h);letter-spacing:1.5px;margin-bottom:8px}
.panel h3{font:700 17px var(--h);letter-spacing:1px;margin:14px 0 6px;color:#d8dcd4}.panel h3 small{font:600 11px var(--f);color:var(--dim);margin-left:8px;letter-spacing:0}
.note{color:var(--dim);margin-bottom:10px;max-width:640px}
.maps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mapcard{cursor:pointer;display:flex;gap:10px;background:rgba(255,255,255,.04);border:2px solid var(--line);border-radius:8px;overflow:hidden;transition:border-color .15s,transform .1s}
.mapcard:hover{border-color:rgba(255,255,255,.35)}
.mapcard.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 6px 24px rgba(182,255,59,.15)}
.mapcard.locked{opacity:.55}
.mc-art{width:92px;min-height:92px;flex-shrink:0;background-size:cover}
.m-downtown .mc-art{background:linear-gradient(160deg,#e8925a,#6a4a6a 60%,#2a2a3a)}
.m-desert .mc-art{background:linear-gradient(160deg,#f0d28a,#c8904a 60%,#6a4a2a)}
.m-forest .mc-art{background:linear-gradient(160deg,#2a3a5a,#0e1a24 60%,#050a0e)}
.m-harbor .mc-art{background:linear-gradient(160deg,#8a9aa0,#3a4a52 60%,#1a2428)}
.mc-art{position:relative}.mc-art::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 60%,rgba(12,14,16,.6))}
.mapcard.locked .mc-art{filter:grayscale(.85) brightness(.6)}
.mc-info{padding:8px 8px 8px 0;display:flex;flex-direction:column;gap:2px}
.mc-info b{font:700 18px var(--h);letter-spacing:1px}.mc-info small{color:var(--dim);font-size:11px}
.skulls{color:var(--red);font-size:12px;letter-spacing:1px}.skulls .dim{color:rgba(255,255,255,.15)}
.mc-st{font-size:11px;color:#c8ccc4}.mc-st.new{color:var(--acc);font-weight:700}
.lock{font-size:12px;color:var(--gold);font-weight:700}
.outbreak{cursor:pointer;margin-bottom:12px;border:2px solid rgba(255,80,60,.5);border-radius:8px;background:linear-gradient(100deg,rgba(120,10,10,.55),rgba(40,8,8,.45));padding:8px 12px;transition:border-color .15s}
.outbreak.sel{border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2),0 6px 24px rgba(255,122,26,.2)}
.outbreak.done{opacity:.6;cursor:default}
.ob-h{display:flex;justify-content:space-between;align-items:center;gap:10px}.ob-h b{font:700 18px var(--h);letter-spacing:1.5px;color:#ff8a70}.ob-h span{font-size:11px;color:#e8c8c0}.ob-h em{font-style:normal;font-weight:700;color:#fff}
.ob-b{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.ob-map{font:700 15px var(--h);letter-spacing:1px}
.mod{background:rgba(0,0,0,.4);border-radius:4px;padding:3px 8px;font-weight:700;font-size:12px}.mod small{display:block;font-weight:400;color:#e0b8b0;font-size:10px}
.ob-rw{margin-left:auto;font:700 18px var(--h);color:var(--gold)}
.deploy-row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
.loadout{color:var(--dim);font-size:12px}
.btn.big.go{animation:glow 1.6s infinite alternate}
/* camp */
.camp-top{display:flex;gap:14px;align-items:center;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.store{flex:1}.st-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}.st-h span{color:var(--dim)}.st-h b{font:700 18px var(--h);color:var(--gold)}
.camp-store-bar{height:10px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden;margin-bottom:4px}.camp-store-bar div{height:100%;background:linear-gradient(90deg,#c8902a,#ffcc33)}
.store small{color:var(--dim);font-size:11px}
.perks{margin-top:8px;color:var(--dim);font-size:12px}.perks b{color:#fff}
.survs{display:flex;flex-wrap:wrap;gap:8px}
.surv{width:84px;text-align:center;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:6px;padding:6px 4px}
.surv b{display:block;font-size:12px}.surv small{color:var(--dim);font-size:10px}
.sv-av{width:42px;height:42px;margin:0 auto 4px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.surv.bed{opacity:.45}.surv.bed .sv-av{background:rgba(255,255,255,.08)}
.empty{color:var(--dim);font-size:12px;padding:8px;border:1px dashed var(--line);border-radius:6px;max-width:520px}
.upgs,.items,.missions{display:flex;flex-direction:column;gap:6px}
.upg,.item,.mission{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.u-ic,.it-ic{font-size:22px;width:36px;text-align:center}
.u-txt,.it-txt,.m-txt{flex:1}.u-txt b,.it-txt b{font:700 15px var(--h);letter-spacing:1px}.u-txt small,.it-txt small{display:block;color:var(--dim);font-size:11px}
.pips{display:flex;gap:3px;margin-top:3px}.pips i{width:16px;height:5px;background:rgba(255,255,255,.14);border-radius:2px}.pips i.on{background:var(--acc)}
.maxed,.eq{font:700 14px var(--h);color:var(--acc);letter-spacing:1px}
.item.eqd{border-color:rgba(182,255,59,.5)}
.bar{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--dim);margin-top:2px}.bar span{width:44px}.bar div{width:140px;height:5px;background:rgba(255,255,255,.1);border-radius:2px}.bar i{display:block;height:100%;background:#d8dcd4;border-radius:2px}
/* daily */
.streak{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:8px;padding:10px}
.streak .st-h b{font:700 17px var(--h);letter-spacing:1px}.streak .st-h span{font-size:12px;color:var(--dim)}.streak em{font-style:normal;color:#fff;font-weight:700}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:8px 0 4px}
.day{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:6px;padding:6px 4px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:100px}
.day small{color:var(--dim);font-size:10px;font-weight:700}.day .d-ic{font-size:22px}.day b{font-size:11px;line-height:1.1}.day em{font-style:normal;font-size:10px;color:var(--dim)}
.day.got{opacity:.5}.day.got em{color:var(--acc);font-size:14px}
.day.today{border-color:var(--acc);background:rgba(182,255,59,.12);box-shadow:0 0 18px rgba(182,255,59,.25)}
.day.tmr{border-color:rgba(255,204,51,.6)}.day.tmr em{color:var(--gold);font-weight:700}
.day .btn{padding:4px 8px;font-size:11px;margin-top:auto}
.warn-sm{color:#d8a890;font-size:11px}
.mbar{height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden;margin:4px 0 2px;max-width:340px}.mbar div{height:100%;background:var(--acc)}
.m-txt b{font-size:13px}.m-txt small{color:var(--dim);font-size:11px}
.mission.done{opacity:.55}.rw{color:var(--gold);font-weight:700}
.bonus{margin-top:10px;padding:10px;border:1px dashed var(--line);border-radius:8px;color:var(--dim);text-align:center}.bonus.ready{border-color:var(--gold)}
/* results & modals */
.results,.death,.pause,.mbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 24px;width:min(560px,92vw);max-height:94vh;overflow-y:auto;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .3s}
.results h1,.death h1,.pause h1{font:700 clamp(34px,5vw,54px) var(--h);letter-spacing:3px;line-height:1}
.results.win h1{color:var(--acc);text-shadow:0 0 24px rgba(182,255,59,.4)}.results.lose h1,.death h1{color:var(--red)}
.rs-stats{display:flex;justify-content:center;gap:18px;margin:10px 0}.rs-stats div{display:flex;flex-direction:column}.rs-stats b{font:700 24px var(--h)}.rs-stats small{color:var(--dim);font-size:11px}
.rs-lines{background:rgba(0,0,0,.3);border-radius:6px;padding:6px 12px;text-align:left}
.rl{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid rgba(255,255,255,.06);opacity:0;animation:fadein .3s forwards}
.rl b{color:var(--gold)}.rl small{color:var(--dim)}
.rl.total{border:0;font:700 20px var(--h);letter-spacing:1px;padding-top:6px}
.rs-xp{display:flex;align-items:center;gap:8px;justify-content:center;margin:10px 0}.rs-xp .xpbar{width:200px}.rs-xp small{color:var(--acc);font-weight:700}
.lvup{background:linear-gradient(90deg,transparent,rgba(255,204,51,.25),transparent);color:var(--gold);font:700 18px var(--h);letter-spacing:1px;padding:6px;margin-bottom:6px;animation:pop .4s}
.newsurv{margin:6px 0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;align-items:center}.newsurv>b{width:100%;font-size:12px;color:var(--dim)}
.ns{background:rgba(255,255,255,.06);border-radius:16px;padding:2px 10px 2px 2px;display:flex;align-items:center;gap:5px;font-weight:700;font-size:12px}.ns i{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px}.ns small{color:var(--dim);font-weight:400}
.rs-missions{text-align:left;margin:8px 0;font-size:12px}.rs-missions>b{display:block;color:var(--dim);margin-bottom:2px}.rm{display:flex;justify-content:space-between;color:var(--dim)}.rm.ok{color:var(--acc)}
.tomorrow{font-size:12px;color:#d8d0b0;background:rgba(255,204,51,.08);border:1px solid rgba(255,204,51,.25);border-radius:6px;padding:6px 8px;margin-top:6px}.tomorrow b{color:var(--gold)}
.rs-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.death p{color:#e0c0b8;margin:8px 0}.death small{color:var(--dim)}
.set{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.keys{color:var(--dim);font-size:12px;max-width:440px;margin:0 auto}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;pointer-events:auto;z-index:4}
.mbox h2{font:700 28px var(--h);letter-spacing:1.5px;margin-bottom:6px}
.mbox .lead{font-size:15px;margin:6px 0;color:#dfe3da}.mbox p{color:var(--dim)}
.howto{list-style:none;text-align:left;margin:10px auto;max-width:400px;display:flex;flex-direction:column;gap:5px}
.bigrw{font-size:54px;margin:8px 0;display:flex;flex-direction:column;align-items:center}.bigrw b{font:700 24px var(--h);letter-spacing:1px;color:var(--gold)}
#modal.reward .mbox{border-color:rgba(255,204,51,.5)}
/* loading */
#loading{position:absolute;inset:0;background:#0b0d0e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;pointer-events:auto;z-index:9}
.ld-logo{font:700 60px var(--h);letter-spacing:4px;color:#fff;text-shadow:0 3px 0 #6a120c}
.ld-bar{width:220px;height:4px;background:rgba(255,255,255,.1)}.ld-bar div{height:100%;background:var(--acc);transition:width .3s}
.ld-txt{color:var(--dim);font-size:12px;max-width:80vw;text-align:center}
@keyframes blink{from{opacity:1}to{opacity:.55}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes toastin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
@keyframes fadein{to{opacity:1}}
@keyframes cpop{from{transform:scale(1.35)}to{transform:none}}
@keyframes glow{from{box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),0 0 0 rgba(182,255,59,0)}to{box-shadow:inset 0 -3px 0 rgba(0,0,0,.35),0 0 22px rgba(182,255,59,.55)}}
@keyframes xh{from{transform:scale(1.6)}to{transform:none}}
/* small screens (mobile landscape) */
@media (max-height:520px),(max-width:760px){
  .hub{padding:8px 10px}.hub nav{width:auto;flex-direction:row;position:absolute;left:10px;right:10px;bottom:8px;justify-content:space-between}
  .nav{flex:1;justify-content:center;font-size:12px;padding:6px 4px;flex-direction:column;gap:0}.nav span{font-size:16px}
  .hub-main{padding-bottom:58px}.panel{max-width:none}.logo.sm{font-size:22px}.xpbar{width:90px}
  .maps{grid-template-columns:repeat(2,minmax(0,1fr))}.mc-art{width:54px;min-height:70px}.mc-info b{font-size:14px}
  .panel h2{font-size:20px}.days{gap:3px}.day{min-height:84px}.day b{font-size:9px}
  .minimap{width:96px;height:96px}.combo{top:118px}
  .weap{padding:5px 30px 5px 8px}.w-ammo b{font-size:22px}
}

body.mobile .combo{right:auto;left:156px;top:96px;text-align:left}body.mobile .combo b{font-size:26px}
body.mobile .hud-bl{bottom:auto;top:86px}
body.mobile .weap{padding:4px 26px 4px 8px}body.mobile .w-ammo b{font-size:20px}body.mobile .w-name{font-size:13px}body.mobile .w-reload{width:96px}
body.mobile .hud-tl{width:min(240px,32vw)}
